[package]
name = "printbridge"
version = "0.1.0"
edition = "2024"
description = "A free, open background worker that bridges web apps to local printers"
 
[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
 
[profile.release]
opt-level = "z"
lto = true
strip = true
